<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/layout}">

<div layout:fragment="content" class="container-md">
    <h1>Login page</h1>
    <form action="/user/login" method="post">
        <div class="mb-3">
            <label for="e" class="form-label">email</label>
            <input type="text" class="form-control" name="email" id="e" placeholder="id@example.com">
        </div>
        <div class="mb-3">
            <label for="p" class="form-label">pwd</label>
            <input type="password" class="form-control" name="pwd" id="p" placeholder="password...">
        </div>
        <button type="submit" class="btn btn-primary">login</button>
    </form>
</div>
